<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" role="img" aria-labelledby="sysTitle sysDesc">
  <title id="sysTitle">The System — how Dolphin Systems works</title>
  <desc id="sysDesc">Diagram: scattered tools (data, requests, decisions) move through one clear connected system (logic, visibility, control) so work moves with less friction and more focus.</desc>
  <defs>
    <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="45" flood-color="#153269" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#122c5c" flood-opacity="0.22"/>
    </filter>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#153269" flood-opacity="0.08"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#255de5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g transform="rotate(1.2 650 400)" font-family="'DM Sans','Space Grotesk',-apple-system,'Segoe UI',Arial,sans-serif">
    <!-- board -->
    <rect x="30" y="30" width="1240" height="740" rx="26" fill="#eaf0fa" stroke="#ccd8ec" stroke-width="2" filter="url(#boardShadow)"/>
    <!-- top row -->
    <text x="92" y="108" font-size="27" font-weight="700" letter-spacing="4" fill="#6b7a90">THE SYSTEM / 01</text>
    <circle cx="982" cy="99" r="9" fill="#255de5"/>
    <text x="1210" y="108" text-anchor="end" font-size="27" font-weight="700" letter-spacing="3" fill="#255de5">Connected</text>
    <!-- white panel -->
    <rect x="90" y="150" width="1120" height="470" rx="20" fill="#ffffff"/>
    <!-- node 1 -->
    <rect x="140" y="225" width="300" height="320" rx="14" fill="#ffffff" stroke="#d5dfed" stroke-width="2" filter="url(#nodeShadow)"/>
    <text x="172" y="292" font-size="25" font-weight="700" letter-spacing="2" fill="#255de5">01 / INPUT</text>
    <text x="172" y="352" font-size="46" font-weight="700" fill="#17233b">Scattered</text>
    <text x="172" y="404" font-size="46" font-weight="700" fill="#17233b">tools</text>
    <text x="172" y="460" font-size="27" fill="#59667a">Data · requests ·</text>
    <text x="172" y="498" font-size="27" fill="#59667a">decisions</text>
    <!-- connector 1 -->
    <line x1="452" y1="385" x2="492" y2="385" stroke="#255de5" stroke-width="3" marker-end="url(#flowArrow)"/>
    <!-- node 2 (center, raised) -->
    <rect x="500" y="205" width="300" height="360" rx="14" fill="#122c5c" filter="url(#cardShadow)"/>
    <text x="532" y="272" font-size="25" font-weight="700" letter-spacing="2" fill="#8fa8d8">02 / SYSTEM</text>
    <text x="532" y="332" font-size="46" font-weight="700" fill="#ffffff">One clear</text>
    <text x="532" y="384" font-size="46" font-weight="700" fill="#ffffff">flow</text>
    <text x="532" y="440" font-size="27" fill="#aebcd3">Logic · visibility ·</text>
    <text x="532" y="478" font-size="27" fill="#aebcd3">control</text>
    <!-- connector 2 -->
    <line x1="812" y1="385" x2="852" y2="385" stroke="#255de5" stroke-width="3" marker-end="url(#flowArrow)"/>
    <!-- node 3 -->
    <rect x="860" y="225" width="300" height="320" rx="14" fill="#ffffff" stroke="#d5dfed" stroke-width="2" filter="url(#nodeShadow)"/>
    <text x="892" y="292" font-size="25" font-weight="700" letter-spacing="2" fill="#255de5">03 / OUTCOME</text>
    <text x="892" y="352" font-size="42" font-weight="700" fill="#17233b">Work moves</text>
    <text x="892" y="460" font-size="27" fill="#59667a">Less friction · more</text>
    <text x="892" y="498" font-size="27" fill="#59667a">focus</text>
    <!-- bottom row -->
    <text x="92" y="700" font-size="29" font-weight="600" fill="#65738a">Designed around the way you work.</text>
    <text x="1210" y="700" text-anchor="end" font-size="27" font-weight="700" letter-spacing="4" fill="#65738a">DS—01</text>
  </g>
</svg>
